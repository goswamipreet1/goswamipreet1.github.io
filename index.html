<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #090b12;
    color: white;
    overflow-x: auto;
    overflow-y: hidden;
}

body::-webkit-scrollbar {
    height: 7px;
}

body::-webkit-scrollbar-thumb {
    background: #007fff;
    border-radius: 20px;
}

.track {
    display: flex;
    width: max-content;
    height: 100vh;
}

.panel {
    width: 100vw;
    min-width: 100vw;
    height: 100vh;
    padding: 55px 8vw;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
}

.panel::before {
    content: "";
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: rgba(0,127,255,0.12);
    filter: blur(70px);
    top: -120px;
    right: -100px;
}
