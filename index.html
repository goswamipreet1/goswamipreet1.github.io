*{
    margin:0;
    padding:0;
    box-sizing:border-box;

html{
    scroll-behavior:smooth;

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080b12;
    color:#fff;
    overflow-x:hidden;

/* MOVING BACKGROUND */

body:before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(0,127,255,.10);
    filter:blur(100px);
    top:-180px;
    right:-150px;
    animation:float 8s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes float{
    from{transform:translate(0,0);}
    to{transform:translate(-80px,120px);}
}

/* NAVIGATION */

nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    display:flex;
    gap:5px;
    padding:8px;
    background:rgba(12,16,25,.85);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:50px;
}

nav a{
    color:#aeb5c0;
    text-decoration:none;
    font-size:12px;
    padding:10px 14px;
    border-radius:30px;
    transition:.3s;
}

nav a:hover{
    background:#007fff;
    color:#fff;
}
